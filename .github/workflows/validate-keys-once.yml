name: Precify 2.1.0 — final key compatibility check
on:
  push:
    branches: [feat/precify-colombia-v2.1.0]
    paths: [.github/validation-trigger-keys.txt]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:connected-api
      - run: pnpm build
      - run: pnpm verify:core
      - run: pnpm audit --audit-level moderate
