name: Precify 2.1 consolidated redesign gate
on:
  push:
    branches: ['feat/precify-colombia-v2.1.0']
permissions:
  contents: read
concurrency:
  group: precify-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:2.1.0
      - name: Real Chromium production UI acceptance
        run: node scripts/browser-redesign-smoke.mjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precify-dark-ui
          path: artifacts/redesign/*.png
          if-no-files-found: ignore
          retention-days: 7
