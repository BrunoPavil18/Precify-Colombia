name: Precify 2.1.0 — connected-contract one-shot validation
# Temporary opt-in signal only. No PR or general push trigger.
on:
  push:
    branches:
      - feat/precify-colombia-v2.1.0
    paths:
      - .github/validation-trigger-2.1.0-connected.txt
permissions:
  contents: read
concurrency:
  group: precify-v2-1-0-connected-once
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Frozen lockfile install
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck
      - name: AST lint
        id: lint
        continue-on-error: true
        run: pnpm lint
      - name: Core, web, backend security and integration tests
        id: tests
        continue-on-error: true
        run: pnpm test
      - name: Service syntax
        id: service
        continue-on-error: true
        run: pnpm check:connected-api
      - name: Production build
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Verify ESM package
        id: package
        continue-on-error: true
        run: pnpm verify:core
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level moderate
      - name: Strict final gate
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SERVICE: ${{ steps.service.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          echo '## Precify 2.1.0 connected contracts' >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for name in INSTALL TYPECHECK LINT TESTS SERVICE BUILD PACKAGE AUDIT; do
            result="${!name}"
            printf '| %s | %s |\n' "$name" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" ]]; then fail=1; fi
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "Failed checks; no merge or release permitted."
            exit 1
          fi
          echo "All automated checks passed; real PostgreSQL and Meta validations remain pending."
