name: Precify 2.1 profiles gate
on:
  push:
    branches: ['feat/precify-colombia-v2.1.0']
    paths: ['.github/profiles-gate-trigger.txt']
permissions:
  contents: read
jobs:
  typecheck-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.7 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:2.1.0
      - run: node scripts/browser-redesign-smoke.mjs
