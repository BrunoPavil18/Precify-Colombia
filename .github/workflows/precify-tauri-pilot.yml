name: Precify Tauri Windows Pilot (single trigger)
on:
  push:
    branches: [feat/precify-colombia-v2.1.0]
    paths: ['.github/tauri-pilot-trigger.txt']
permissions:
  contents: read
jobs:
  win-x64:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:2.1.0
      - name: Build Tauri 2 executable for Windows x64
        working-directory: apps/desktop
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --no-bundle
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --no-progress -y }
      - name: Bundle portable ZIP and Inno Setup
        shell: pwsh
        run: .\scripts\package-desktop.ps1 -RequireInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: Precify-Colombia-Tauri2-Windows-pilot
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
